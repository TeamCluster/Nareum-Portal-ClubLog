{% extends "setting_base.html" %}
{% block title %}관리자 대시보드{% endblock %}
{% block content %}
<div class="setting-container">
    <h1>대시보드</h1>
    <p>나름청소년활동센터 동아리 활동 현황입니다.</p>
    
    <div class="dashboard-grid">
        <div class="card">
            <h3>오늘의 동아리 활동 실적 건수</h3>
            <p class="stat">{{ today_activity_count }}개</p>
        </div>
        <div class="card">
            <h3>총 등록된 동아리 수</h3>
            <p class="stat">{{ total_club_count }}개</p>
        </div>
        <!-- 다른 통계 정보 카드 추가 가능 -->
    </div>
    <h2>최근 활동 이력 5건 (최신순)</h2>
    <div class="table-log">
        {{ recent_logs | safe }}
    </div>
</div>

<style>
.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-top: 30px;
}
.card {
    background-color: #ffffff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    text-align: center;
}
.card h3 {
    margin-top: 0;
    color: #3366cc;
}
.card .stat {
    font-size: 2.5rem;
    font-weight: bold;
    color: #333;
    margin: 10px 0 0;
}
</style>
{% endblock %}
